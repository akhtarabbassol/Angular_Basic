<section  class="w-screen min-h-screen flex flex-wrap p-7 gap-5 justify-evenly">
  @if (User.isLoading()) {
    <h1 class="text-2xl font-bold">
      Loading...
    </h1>
  }

  @if (User.error()) {
    <h1 class="text-2xl text-red-500 font-bold">
      Failed to load users
    </h1>
  }
  @for (i of Users(); track i.id) {
    <div class="w-68 h-52 bg-gray-300 flex flex-col justify-center rounded-md p-5">
      <h1> Id: {{ i.id }}</h1>
      <h1> Name : {{ i.name }} </h1>
      <h1> Email : {{ i.email }} </h1>
      <h1> Address : {{ i.address.city }} </h1>
      <div class="w-full h-1/3 flex justify-evenly items-center" >
        <button (click)="UpdateUser(i)"
          class="w-1/3 h-1/2 bg-blue-500 text-white font-semibold rounded-md cursor-pointer hover:bg-white hover:text-blue-500" >
          Update
        </button>
        <button (click)="DelUser(i.id)"
          class="w-1/3 h-1/2 bg-red-500 text-white font-semibold rounded-md cursor-pointer hover:bg-white hover:text-red-500">
          Delete
        </button>
      </div>
    </div>
  }

</section>
@if (showEditBox()) {
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center">
    <div class="w-96 bg-white rounded-lg p-6 shadow-xl">
      <h1 class="text-2xl font-bold mb-5"> Update User </h1>
      <label class="font-semibold">
        Name
      </label>
      <input type="text" [value]="editName()"
        (input)="editName.set($any($event.target).value)"
        class="w-full border border-gray-300 rounded-md p-2 mb-4" />

<label class="font-semibold"> Email </label>
      <input type="email" [value]="editEmail()"
        (input)="editEmail.set($any($event.target).value)"
        class="w-full border border-gray-300 rounded-md p-2 mb-4" />

      <label class="font-semibold"> Address </label>
      <input type="text" [value]="editCity()"
        (input)="editCity.set($any($event.target).value)"
        class="w-full border border-gray-300 rounded-md p-2 mb-5" />
    <div class="flex justify-end gap-3">
        <button (click)="CancelUpdate()"
          class="px-5 py-2 bg-gray-500 text-white rounded-md cursor-pointer">
          Cancel
        </button>

        <button (click)="SaveUser()"
          class="px-5 py-2 bg-blue-500 text-white rounded-md cursor-pointer" >
          Save
        </button>
      </div>
    </div>
  </div>
}
